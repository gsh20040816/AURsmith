[workspace]
members = [
  "crates/aursmith-domain",
  "crates/aursmith-protocol",
  "crates/aursmith-controller",
  "crates/aursmith-worker",
  "crates/aursmithctl",
  "crates/aursmith-agent-runner",
  "crates/aursmith-agent-gateway",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
hex = "0.4"
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
thiserror = "2.0"
tempfile = "3.23"
tokio = { version = "1.47", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "sensitive-headers"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
