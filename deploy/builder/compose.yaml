name: aursmith-builder

services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/images/worker.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - ${KVM_GID:?请设置宿主机 KVM_GID}
      - ${AURSMITH_SECRET_GID:?请设置宿主机部署密钥所属 GID}
    environment:
      AURSMITH_WORKER_NAME: ${AURSMITH_WORKER_NAME:-compute-01}
      AURSMITH_WORKER_ROLE: builder
      AURSMITH_WORKER_DATABASE: sqlite:///var/lib/aursmith/runtime/worker.db
      AURSMITH_WORKER_SOCKET: /run/aursmith/worker.sock
      AURSMITH_CONTROLLER_VERIFYING_KEY_HEX: ${AURSMITH_CONTROLLER_VERIFYING_KEY_HEX:?必须固定 Controller 公钥}
      AURSMITH_PROFILES_DIR: /profiles
      AURSMITH_JOBS_DIR: /jobs
      AURSMITH_BUILD_NETWORK: ${AURSMITH_BUILD_NETWORK:-false}
      AURSMITH_CONTROLLER_POLL_URL: ${AURSMITH_CONTROLLER_POLL_URL:?必须设置公网 Controller HTTPS 轮询地址}
      AURSMITH_REVERSE_PUBLISHER_ENDPOINT: ${AURSMITH_REVERSE_PUBLISHER_ENDPOINT:?必须设置 Publisher SSH 推送端点}
      AURSMITH_REVERSE_PUSH_SSH_IDENTITY_FILE: /run/secrets/publisher_push_key
      AURSMITH_REVERSE_PUSH_SSH_KNOWN_HOSTS_FILE: /run/secrets/publisher_known_hosts
      RUST_LOG: ${RUST_LOG:-aursmith=info}
    secrets:
      - publisher_push_key
      - publisher_known_hosts
    volumes:
      - worker-run:/run/aursmith
      - builder-state:/var/lib/aursmith
      - builder-profiles:/profiles
      - builder-jobs:/jobs
      - builder-cache:/cache
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks: [worker]
    healthcheck:
      test: [CMD, /usr/local/bin/aursmithctl, worker, --socket, /run/aursmith/worker.sock, status]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  profile-builder:
    profiles: [profile-build]
    build:
      context: ../..
      dockerfile: deploy/images/profile-builder.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
        AURSMITH_ARCH_MIRROR: ${AURSMITH_ARCH_MIRROR:-https://geo.mirror.pkgbuild.com}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - profile-output:/out
    tmpfs:
      - /tmp:size=64m,mode=1777

secrets:
  publisher_push_key:
    file: ${AURSMITH_PUBLISHER_PUSH_KEY_FILE:-./secrets/publisher_push_key}
  publisher_known_hosts:
    file: ${AURSMITH_PUBLISHER_KNOWN_HOSTS_FILE:-./secrets/publisher_known_hosts}

volumes:
  worker-run:
  builder-state:
  builder-profiles:
  builder-jobs:
  builder-cache:
  profile-output:

networks:
  worker:
