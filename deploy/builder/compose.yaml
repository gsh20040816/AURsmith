name: aursmith-builder

services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/images/worker.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - ${KVM_GID:?请设置宿主机 KVM_GID}
    environment:
      AURSMITH_WORKER_NAME: ${AURSMITH_WORKER_NAME:-compute-01}
      AURSMITH_WORKER_ROLE: builder
      AURSMITH_WORKER_DATABASE: sqlite:///var/lib/aursmith/runtime/worker.db
      AURSMITH_WORKER_SOCKET: /run/aursmith/worker.sock
      AURSMITH_CONTROLLER_VERIFYING_KEY_HEX: ${AURSMITH_CONTROLLER_VERIFYING_KEY_HEX:?必须固定 Controller 公钥}
      AURSMITH_PROFILES_DIR: /profiles
      AURSMITH_JOBS_DIR: /jobs
      AURSMITH_FETCH_PROXY: ${AURSMITH_FETCH_PROXY:?必须设置 Publisher source proxy 的固定 IP:端口}
      RUST_LOG: ${RUST_LOG:-aursmith=info}
    volumes:
      - worker-run:/run/aursmith
      - builder-state:/var/lib/aursmith
      - builder-profiles:/profiles
      - builder-jobs:/jobs
      - builder-cache:/cache
    tmpfs:
      - /tmp:size=512m,mode=1777
    networks: [worker]
    healthcheck:
      test: [CMD, /usr/local/bin/aursmithctl, worker, --socket, /run/aursmith/worker.sock, status]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ssh:
    build:
      context: ../..
      dockerfile: deploy/images/worker.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    entrypoint: [/usr/local/bin/aursmithctl]
    command: [run-sshd]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETPCAP, SETUID]
    security_opt: [no-new-privileges:true]
    volumes:
      - worker-run:/run/aursmith
      - builder-jobs:/jobs:ro
      - ../common/sshd_config:/etc/ssh/sshd_config:ro
    secrets:
      - ssh_host_ed25519_key
      - authorized_keys
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/private:uid=0,gid=0,mode=0755,size=2m
    ports:
      - ${AURSMITH_SSH_BIND:-127.0.0.1:2222}:2222
    networks: [worker]
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

  profile-builder:
    profiles: [profile-build]
    build:
      context: ../..
      dockerfile: deploy/images/profile-builder.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    volumes:
      - profile-output:/out
    tmpfs:
      - /tmp:size=64m,mode=1777

secrets:
  ssh_host_ed25519_key:
    file: ${AURSMITH_SSH_HOST_KEY_FILE:-./secrets/ssh_host_ed25519_key}
  authorized_keys:
    file: ${AURSMITH_AUTHORIZED_KEYS_FILE:-./secrets/authorized_keys}

volumes:
  worker-run:
  builder-state:
  builder-profiles:
  builder-jobs:
  builder-cache:
  profile-output:

networks:
  worker:
