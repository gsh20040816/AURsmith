name: aursmith-publisher

services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/images/worker.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      AURSMITH_WORKER_NAME: ${AURSMITH_WORKER_NAME:-repo-edge-01}
      AURSMITH_WORKER_ROLE: publisher
      AURSMITH_WORKER_DATABASE: sqlite:///var/lib/aursmith/runtime/worker.db
      AURSMITH_WORKER_SOCKET: /run/aursmith/worker.sock
      AURSMITH_CONTROLLER_VERIFYING_KEY_HEX: ${AURSMITH_CONTROLLER_VERIFYING_KEY_HEX:?必须固定 Controller 公钥}
      AURSMITH_AUR_BASE_URL: ${AURSMITH_AUR_BASE_URL:-https://aur.archlinux.org/}
      AURSMITH_PACOLOCO_METRICS_URL: http://pacoloco:9129/metrics
      AURSMITH_TRANSFER_ENDPOINTS_JSON: ${AURSMITH_TRANSFER_ENDPOINTS_JSON:?必须配置 Builder ID 到 SSH 端点的静态映射}
      AURSMITH_TRANSFER_SSH_IDENTITY_FILE: /run/secrets/builder_pull_key
      AURSMITH_TRANSFER_SSH_KNOWN_HOSTS_FILE: /run/secrets/builder_known_hosts
      AURSMITH_WRITER_EPOCH: ${AURSMITH_WRITER_EPOCH:-0}
      AURSMITH_SIGNER_INBOX: /signer-inbox
      AURSMITH_SIGNER_OUTPUT: /signer-output
      AURSMITH_REPOSITORY_DIR: /repository
      AURSMITH_REPOSITORY_ARCH: ${AURSMITH_REPOSITORY_ARCH:-x86_64}
      AURSMITH_REPOSITORY_GPG_PUBLIC_KEY_FILE: /run/secrets/repository_gpg_public_key
      AURSMITH_PUBLISHER_GPG_HOME: /run/aursmith-gpg
      AURSMITH_RELEASE_RETENTION_DAYS: ${AURSMITH_RELEASE_RETENTION_DAYS:-30}
      AURSMITH_RELEASE_RETENTION_MIN_VERSIONS: ${AURSMITH_RELEASE_RETENTION_MIN_VERSIONS:-3}
      AURSMITH_JOBS_DIR: /jobs
      RUST_LOG: ${RUST_LOG:-aursmith=info}
    volumes:
      - worker-run:/run/aursmith
      - publisher-state:/var/lib/aursmith
      - publisher-landing:/landing
      - publisher-staging:/staging
      - publisher-staging:/jobs
      - publisher-hot:/repository
      - signer-inbox:/signer-inbox
      - signer-output:/signer-output:ro
    secrets:
      - builder_pull_key
      - builder_known_hosts
      - repository_gpg_public_key
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/aursmith-gpg:uid=10001,gid=10001,mode=0700,size=16m
    networks: [control, egress]
    healthcheck:
      test: [CMD, /usr/local/bin/aursmithctl, worker, --socket, /run/aursmith/worker.sock, status]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  signer:
    build:
      context: ../..
      dockerfile: deploy/images/signer.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    environment:
      AURSMITH_CONTROLLER_VERIFYING_KEY_HEX: ${AURSMITH_CONTROLLER_VERIFYING_KEY_HEX:?必须固定 Controller 公钥}
      AURSMITH_GPG_PRIVATE_KEY_FILE: /run/secrets/repository_gpg_private_key
      AURSMITH_GPG_HOME: /run/aursmith-gnupg
      AURSMITH_SIGNER_INBOX: /inbox
      AURSMITH_SIGNER_OUTPUT: /signed
    secrets:
      - repository_gpg_private_key
    volumes:
      - signer-inbox:/inbox:ro
      - signer-output:/signed
    tmpfs:
      - /run/aursmith-gnupg:uid=10001,gid=10001,mode=0700,size=16m
      - /tmp:uid=10001,gid=10001,mode=0700,size=64m
    restart: unless-stopped

  ssh:
    build:
      context: ../..
      dockerfile: deploy/images/worker.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    entrypoint: [/usr/local/bin/aursmithctl]
    command: [run-sshd]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETPCAP, SETUID]
    security_opt: [no-new-privileges:true]
    volumes:
      - worker-run:/run/aursmith
      - publisher-staging:/jobs:ro
      - publisher-landing:/landing
      - ../common/sshd_config:/etc/ssh/sshd_config:ro
    secrets:
      - ssh_host_ed25519_key
      - authorized_keys
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/private:uid=0,gid=0,mode=0755,size=2m
    ports:
      - ${AURSMITH_SSH_BIND:-127.0.0.1:2223}:2222
    networks: [control]
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

  repository:
    build:
      context: ../..
      dockerfile: deploy/images/repository.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - publisher-hot:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config:uid=10001,gid=10001,size=16m,mode=0700
      - /data:uid=10001,gid=10001,size=16m,mode=0700
      - /tmp:size=16m,mode=1777
    ports:
      - ${AURSMITH_REPOSITORY_BIND:-127.0.0.1:8081}:8080
    networks: [control]
    restart: unless-stopped

  pacoloco:
    build:
      context: ../..
      dockerfile: deploy/images/pacoloco.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
        AURSMITH_ARCH_MIRROR: ${AURSMITH_ARCH_MIRROR:-https://geo.mirror.pkgbuild.com}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - pacoloco-cache:/var/cache/pacoloco
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700,size=16m
    networks: [control, egress]
    healthcheck:
      test: [CMD, /usr/bin/wget, --quiet, --spider, http://127.0.0.1:9129/metrics]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

secrets:
  ssh_host_ed25519_key:
    file: ${AURSMITH_SSH_HOST_KEY_FILE:-./secrets/ssh_host_ed25519_key}
  authorized_keys:
    file: ${AURSMITH_AUTHORIZED_KEYS_FILE:-./secrets/authorized_keys}
  repository_gpg_private_key:
    file: ${AURSMITH_GPG_PRIVATE_KEY_FILE:-./secrets/repository_gpg_private_key.asc}
  repository_gpg_public_key:
    file: ${AURSMITH_GPG_PUBLIC_KEY_FILE:-./secrets/repository_gpg_public_key.asc}
  builder_pull_key:
    file: ${AURSMITH_BUILDER_PULL_KEY_FILE:-./secrets/builder_pull_key}
  builder_known_hosts:
    file: ${AURSMITH_BUILDER_KNOWN_HOSTS_FILE:-./secrets/builder_known_hosts}

volumes:
  worker-run:
  publisher-state:
  publisher-landing:
  publisher-staging:
  publisher-hot:
  signer-inbox:
  signer-output:
  pacoloco-cache:

networks:
  control:
  egress:
