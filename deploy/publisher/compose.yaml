name: aursmith-publisher

services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/images/worker.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      AURSMITH_WORKER_NAME: ${AURSMITH_WORKER_NAME:-repo-edge-01}
      AURSMITH_WORKER_ROLE: publisher
      AURSMITH_WORKER_DATABASE: sqlite:///var/lib/aursmith/runtime/worker.db
      AURSMITH_WORKER_SOCKET: /run/aursmith/worker.sock
      AURSMITH_AUR_BASE_URL: ${AURSMITH_AUR_BASE_URL:-https://aur.archlinux.org/}
      AURSMITH_PUBLISHER_STAGING_DIR: /staging
      AURSMITH_REPOSITORY_DIR: /repository
      AURSMITH_REPOSITORY_ARCH: ${AURSMITH_REPOSITORY_ARCH:-x86_64}
      AURSMITH_REPOSITORY_HTTP_BIND: 0.0.0.0:8080
      AURSMITH_REPOSITORY_GPG_PUBLIC_KEY_FILE: /run/secrets/repository_gpg_public_key
      AURSMITH_REPOSITORY_GPG_PRIVATE_KEY_FILE: /run/secrets/repository_gpg_private_key
      AURSMITH_PUBLISHER_GPG_HOME: /run/aursmith-gpg
      AURSMITH_KEYRING_REFRESH_DAYS: ${AURSMITH_KEYRING_REFRESH_DAYS:-30}
      AURSMITH_JOBS_DIR: /jobs
      RUST_LOG: ${RUST_LOG:-aursmith=info}
    volumes:
      - worker-run:/run/aursmith
      - publisher-state:/var/lib/aursmith
      - publisher-landing:/landing
      - publisher-staging:/staging
      - publisher-staging:/jobs
      - publisher-hot:/repository
    secrets:
      - repository_gpg_public_key
      - repository_gpg_private_key
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/aursmith-gpg:uid=10001,gid=10001,mode=0700,size=16m
    ports:
      - ${AURSMITH_REPOSITORY_BIND:-127.0.0.1:18081}:8080
    networks: [control, egress]
    healthcheck:
      test: [CMD, /usr/local/bin/aursmithctl, worker, --socket, /run/aursmith/worker.sock, status]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ssh:
    build:
      context: ../..
      dockerfile: deploy/images/worker.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    entrypoint: [/usr/local/bin/aursmithctl]
    command: [run-sshd]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETPCAP, SETUID]
    security_opt: [no-new-privileges:true]
    volumes:
      - worker-run:/run/aursmith
      - publisher-staging:/jobs:ro
      - publisher-landing:/landing
      - ../common/sshd_config:/etc/ssh/sshd_config:ro
    secrets:
      - ssh_host_ed25519_key
      - authorized_keys
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/private:uid=0,gid=0,mode=0755,size=2m
    ports:
      - ${AURSMITH_SSH_BIND:-127.0.0.1:2223}:2222
    networks:
      control:
      backbone:
        aliases: [publisher-ssh]
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

secrets:
  ssh_host_ed25519_key:
    file: ${AURSMITH_SSH_HOST_KEY_FILE:-./secrets/ssh_host_ed25519_key}
  authorized_keys:
    file: ${AURSMITH_AUTHORIZED_KEYS_FILE:-./secrets/authorized_keys}
  repository_gpg_private_key:
    file: ${AURSMITH_GPG_PRIVATE_KEY_FILE:-./secrets/repository_gpg_private_key.asc}
  repository_gpg_public_key:
    file: ${AURSMITH_GPG_PUBLIC_KEY_FILE:-./secrets/repository_gpg_public_key.asc}

volumes:
  worker-run:
  publisher-state:
  publisher-landing:
  publisher-staging:
  publisher-hot:

networks:
  backbone:
    external: true
    name: aursmith-backbone
  control:
  egress:
