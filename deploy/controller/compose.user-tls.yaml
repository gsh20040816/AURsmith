services:
  controller:
    environment:
      AURSMITH_CLIENT_CA_CERTIFICATE_FILE: ""

  web:
    volumes:
      - ./Caddyfile.user-tls:/etc/caddy/Caddyfile:ro
    secrets:
      - web_tls_certificate
      - web_tls_private_key

secrets:
  web_tls_certificate:
    file: ${AURSMITH_WEB_TLS_CERTIFICATE_FILE:?必须设置用户 TLS 证书文件}
  web_tls_private_key:
    file: ${AURSMITH_WEB_TLS_PRIVATE_KEY_FILE:?必须设置用户 TLS 私钥文件}
