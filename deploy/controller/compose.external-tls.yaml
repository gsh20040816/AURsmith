services:
  web:
    volumes:
      - ./Caddyfile.external-tls:/etc/caddy/Caddyfile:ro
    secrets:
      - web_tls_fullchain
      - web_tls_private_key

secrets:
  web_tls_fullchain:
    file: ${AURSMITH_WEB_TLS_FULLCHAIN_FILE:?必须配置公网 TLS 完整证书链}
  web_tls_private_key:
    file: ${AURSMITH_WEB_TLS_PRIVATE_KEY_FILE:?必须配置公网 TLS 私钥}
