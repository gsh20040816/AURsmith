name: aursmith

services:
  controller:
    build:
      context: ../..
      dockerfile: deploy/images/controller.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      AURSMITH_BIND: 0.0.0.0:8080
      AURSMITH_DATABASE_URL: sqlite:///var/lib/aursmith/controller.db
      AURSMITH_PUBLIC_ORIGIN: ${AURSMITH_PUBLIC_ORIGIN:?必须设置管理站点的固定 HTTPS Origin}
      AURSMITH_SESSION_IDLE_MINUTES: ${AURSMITH_SESSION_IDLE_MINUTES:-60}
      AURSMITH_SESSION_ABSOLUTE_HOURS: ${AURSMITH_SESSION_ABSOLUTE_HOURS:-168}
      AURSMITH_LOW_AGENT_ENDPOINTS: http://agent-low-1:8090,http://agent-low-2:8090,http://agent-low-3:8090
      AURSMITH_HIGH_AGENT_ENDPOINT: http://agent-high:8090
      AURSMITH_REPOSITORY_NAME: ${AURSMITH_REPOSITORY_NAME:-aursmith}
      AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
      AURSMITH_REPOSITORY_BASE_URL: ${AURSMITH_REPOSITORY_BASE_URL:-https://repo.aursmith.lan}
      AURSMITH_BUILDER_TOKEN_SHA256: ${AURSMITH_BUILDER_TOKEN_SHA256:?必须设置固定 Builder Bearer secret 的 SHA-256}
      AURSMITH_BUILDER_MAX_CONCURRENT: ${AURSMITH_BUILDER_MAX_CONCURRENT:-1}
      AURSMITH_UPDATE_INTERVAL_MINUTES: ${AURSMITH_UPDATE_INTERVAL_MINUTES:-30}
      AURSMITH_PUBLISHER_SOCKET: /run/aursmith-publisher/worker.sock
      RUST_LOG: ${RUST_LOG:-aursmith=info}
    volumes:
      - controller-data:/var/lib/aursmith
      - controller-run:/run/aursmith
      - publisher-run:/run/aursmith-publisher
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - ${AURSMITH_WEB_BIND:-127.0.0.1:18443}:8080
    networks: [agent-low-1-control, agent-low-2-control, agent-low-3-control, agent-high-control, egress, edge]
    healthcheck:
      test: [CMD, /usr/local/bin/aursmithctl, doctor, --role, controller]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  agent-low-1: &agent-runner
    build:
      context: ../..
      dockerfile: deploy/images/agent-runner.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    # Codex 使用非特权 bubblewrap user namespace；Docker 默认 seccomp 和 Debian 的
    # docker-default AppArmor 都会阻止其 mount namespace。Runner 自身仍无 capability、
    # 无特权、根文件系统只读，并由 Codex 的 workspace sandbox 限制审计工作区。
    security_opt: [no-new-privileges:true, seccomp:unconfined, apparmor:unconfined]
    environment:
      AURSMITH_AGENT_ADAPTER: codex
      AURSMITH_AGENT_PROVIDER: ${AURSMITH_LOW_AGENT_1_PROVIDER:-openai}
      AURSMITH_AGENT_MODEL: ${AURSMITH_LOW_AGENT_1_MODEL-}
      AURSMITH_AGENT_REASONING_EFFORT: ${AURSMITH_LOW_AGENT_1_REASONING_EFFORT-}
      AURSMITH_AGENT_TIMEOUT_SECONDS: ${AURSMITH_AGENT_TIMEOUT_SECONDS:-600}
      AURSMITH_AGENT_BASE_URL: http://agent-credential-gateway:8091/low-1/
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=0700,size=32m
    networks: [agent-low-1-control, agent-low-1-provider]
    restart: unless-stopped

  agent-low-2:
    <<: *agent-runner
    environment:
      AURSMITH_AGENT_ADAPTER: codex
      AURSMITH_AGENT_PROVIDER: ${AURSMITH_LOW_AGENT_2_PROVIDER:-openai}
      AURSMITH_AGENT_MODEL: ${AURSMITH_LOW_AGENT_2_MODEL-}
      AURSMITH_AGENT_REASONING_EFFORT: ${AURSMITH_LOW_AGENT_2_REASONING_EFFORT-}
      AURSMITH_AGENT_TIMEOUT_SECONDS: ${AURSMITH_AGENT_TIMEOUT_SECONDS:-600}
      AURSMITH_AGENT_BASE_URL: http://agent-credential-gateway:8091/low-2/
    networks: [agent-low-2-control, agent-low-2-provider]

  agent-low-3:
    <<: *agent-runner
    environment:
      AURSMITH_AGENT_ADAPTER: codex
      AURSMITH_AGENT_PROVIDER: ${AURSMITH_LOW_AGENT_3_PROVIDER:-openai}
      AURSMITH_AGENT_MODEL: ${AURSMITH_LOW_AGENT_3_MODEL-}
      AURSMITH_AGENT_REASONING_EFFORT: ${AURSMITH_LOW_AGENT_3_REASONING_EFFORT-}
      AURSMITH_AGENT_TIMEOUT_SECONDS: ${AURSMITH_AGENT_TIMEOUT_SECONDS:-600}
      AURSMITH_AGENT_BASE_URL: http://agent-credential-gateway:8091/low-3/
    networks: [agent-low-3-control, agent-low-3-provider]

  agent-high:
    <<: *agent-runner
    environment:
      AURSMITH_AGENT_ADAPTER: ${AURSMITH_HIGH_AGENT_ADAPTER:-codex}
      AURSMITH_AGENT_PROVIDER: ${AURSMITH_HIGH_AGENT_PROVIDER:-openai}
      AURSMITH_AGENT_MODEL: ${AURSMITH_HIGH_AGENT_MODEL-gpt-5.6-terra}
      AURSMITH_AGENT_REASONING_EFFORT: ${AURSMITH_HIGH_AGENT_REASONING_EFFORT-}
      AURSMITH_AGENT_TIMEOUT_SECONDS: ${AURSMITH_AGENT_TIMEOUT_SECONDS:-600}
      AURSMITH_AGENT_BASE_URL: http://agent-credential-gateway:8091/high/
    networks: [agent-high-control, agent-high-provider]

  agent-credential-gateway:
    build:
      context: ../..
      dockerfile: deploy/images/agent-gateway.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      AURSMITH_LOW_AGENT_1_PROVIDER_BASE_URL: ${AURSMITH_LOW_AGENT_1_BASE_URL-}
      AURSMITH_LOW_AGENT_1_AUTH_STYLE: ${AURSMITH_LOW_AGENT_1_AUTH_STYLE:-bearer}
      AURSMITH_LOW_AGENT_1_API_KEY_FILE: /run/secrets/low_agent_1_api_key
      AURSMITH_LOW_AGENT_2_PROVIDER_BASE_URL: ${AURSMITH_LOW_AGENT_2_BASE_URL-}
      AURSMITH_LOW_AGENT_2_AUTH_STYLE: ${AURSMITH_LOW_AGENT_2_AUTH_STYLE:-bearer}
      AURSMITH_LOW_AGENT_2_API_KEY_FILE: /run/secrets/low_agent_2_api_key
      AURSMITH_LOW_AGENT_3_PROVIDER_BASE_URL: ${AURSMITH_LOW_AGENT_3_BASE_URL-}
      AURSMITH_LOW_AGENT_3_AUTH_STYLE: ${AURSMITH_LOW_AGENT_3_AUTH_STYLE:-bearer}
      AURSMITH_LOW_AGENT_3_API_KEY_FILE: /run/secrets/low_agent_3_api_key
      AURSMITH_HIGH_AGENT_PROVIDER_BASE_URL: ${AURSMITH_HIGH_AGENT_BASE_URL-https://api.openai.com/v1/}
      AURSMITH_HIGH_AGENT_AUTH_STYLE: ${AURSMITH_HIGH_AGENT_AUTH_STYLE:-bearer}
      AURSMITH_HIGH_AGENT_API_KEY_FILE: /run/secrets/high_agent_api_key
    secrets:
      - low_agent_1_api_key
      - low_agent_2_api_key
      - low_agent_3_api_key
      - high_agent_api_key
    tmpfs:
      - /tmp:uid=10003,gid=10003,mode=0700,size=8m
    networks: [agent-low-1-provider, agent-low-2-provider, agent-low-3-provider, agent-high-provider, egress]
    restart: unless-stopped

  publisher:
    build:
      context: ../..
      dockerfile: deploy/images/worker.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      AURSMITH_WORKER_NAME: publisher
      AURSMITH_WORKER_ROLE: publisher
      AURSMITH_WORKER_DATABASE: sqlite:///var/lib/aursmith/runtime/worker.db
      AURSMITH_WORKER_SOCKET: /run/aursmith/worker.sock
      AURSMITH_AUR_BASE_URL: ${AURSMITH_AUR_BASE_URL:-https://aur.archlinux.org/}
      AURSMITH_PUBLISHER_STAGING_DIR: /staging
      AURSMITH_REPOSITORY_DIR: /repository
      AURSMITH_REPOSITORY_ARCH: x86_64
      AURSMITH_REPOSITORY_HTTP_BIND: 0.0.0.0:8080
      AURSMITH_REPOSITORY_GPG_PUBLIC_KEY_FILE: /run/secrets/repository_gpg_public_key
      AURSMITH_REPOSITORY_GPG_PRIVATE_KEY_FILE: /run/secrets/repository_gpg_private_key
      AURSMITH_PUBLISHER_GPG_HOME: /run/aursmith-gpg
      AURSMITH_KEYRING_REFRESH_DAYS: ${AURSMITH_KEYRING_REFRESH_DAYS:-30}
      AURSMITH_JOBS_DIR: /jobs
      RUST_LOG: ${RUST_LOG:-aursmith=info}
    volumes:
      - publisher-run:/run/aursmith
      - publisher-state:/var/lib/aursmith
      - publisher-landing:/landing
      - publisher-staging:/staging
      - publisher-staging:/jobs
      - publisher-hot:/repository
    secrets:
      - repository_gpg_public_key
      - repository_gpg_private_key
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/aursmith-gpg:uid=10001,gid=10001,mode=0700,size=16m
    ports:
      - ${AURSMITH_REPOSITORY_BIND:-127.0.0.1:18081}:8080
    networks: [publisher-control, egress]
    healthcheck:
      test: [CMD, /usr/local/bin/aursmithctl, worker, --socket, /run/aursmith/worker.sock, status]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  publisher-ssh:
    build:
      context: ../..
      dockerfile: deploy/images/worker.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    entrypoint: [/usr/local/bin/aursmithctl]
    command: [run-sshd]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETPCAP, SETUID]
    security_opt: [no-new-privileges:true]
    volumes:
      - publisher-run:/run/aursmith
      - publisher-landing:/landing
      - ../common/sshd_config:/etc/ssh/sshd_config:ro
    secrets:
      - ssh_host_ed25519_key
      - authorized_keys
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run/private:uid=0,gid=0,mode=0755,size=2m
    ports:
      - ${AURSMITH_SSH_BIND:-127.0.0.1:2223}:2222
    networks: [publisher-control, edge]
    depends_on:
      publisher:
        condition: service_healthy
    restart: unless-stopped

secrets:
  low_agent_1_api_key:
    file: ${AURSMITH_LOW_AGENT_1_API_KEY_FILE:-./secrets/low_agent_1_api_key}
  low_agent_2_api_key:
    file: ${AURSMITH_LOW_AGENT_2_API_KEY_FILE:-./secrets/low_agent_2_api_key}
  low_agent_3_api_key:
    file: ${AURSMITH_LOW_AGENT_3_API_KEY_FILE:-./secrets/low_agent_3_api_key}
  high_agent_api_key:
    file: ${AURSMITH_HIGH_AGENT_API_KEY_FILE:-./secrets/high_agent_api_key}
  ssh_host_ed25519_key:
    file: ${AURSMITH_SSH_HOST_KEY_FILE:-../publisher/secrets/ssh_host_ed25519_key}
  authorized_keys:
    file: ${AURSMITH_AUTHORIZED_KEYS_FILE:-../publisher/secrets/authorized_keys}
  repository_gpg_private_key:
    file: ${AURSMITH_GPG_PRIVATE_KEY_FILE:-../publisher/secrets/repository_gpg_private_key.asc}
  repository_gpg_public_key:
    file: ${AURSMITH_GPG_PUBLIC_KEY_FILE:-../publisher/secrets/repository_gpg_public_key.asc}

volumes:
  controller-data:
    name: aursmith-controller_controller-data
    external: true
  controller-run:
  publisher-run:
    name: aursmith-publisher_worker-run
    external: true
  publisher-state:
    name: aursmith-publisher_publisher-state
    external: true
  publisher-landing:
    name: aursmith-publisher_publisher-landing
    external: true
  publisher-staging:
    name: aursmith-publisher_publisher-staging
    external: true
  publisher-hot:
    name: aursmith-publisher_publisher-hot
    external: true

networks:
  agent-low-1-control:
    internal: true
  agent-low-2-control:
    internal: true
  agent-low-3-control:
    internal: true
  agent-high-control:
    internal: true
  agent-low-1-provider:
    internal: true
  agent-low-2-provider:
    internal: true
  agent-low-3-provider:
    internal: true
  agent-high-provider:
    internal: true
  publisher-control:
    internal: true
  egress:
  edge:
