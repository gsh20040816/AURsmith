name: aursmith-controller

services:
  controller:
    build:
      context: ../..
      dockerfile: deploy/images/controller.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      AURSMITH_BIND: 0.0.0.0:8080
      AURSMITH_DATABASE_URL: sqlite:///var/lib/aursmith/controller.db
      AURSMITH_SETUP_TOKEN_FILE: /run/secrets/setup_token
      AURSMITH_SIGNING_KEY_FILE: /run/secrets/controller_signing_key
      AURSMITH_SSH_IDENTITY_FILE: /run/secrets/worker_ssh_key
      AURSMITH_SSH_KNOWN_HOSTS_FILE: /run/secrets/worker_known_hosts
      AURSMITH_SECURE_COOKIES: ${AURSMITH_SECURE_COOKIES:-true}
      RUST_LOG: ${RUST_LOG:-aursmith=info}
    secrets:
      - source: setup_token
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: controller_signing_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: worker_ssh_key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: worker_known_hosts
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - controller-data:/var/lib/aursmith
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [control]
    healthcheck:
      test: [CMD, /usr/local/bin/aursmithctl, doctor, --role, controller]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/images/web.Dockerfile
      args:
        AURSMITH_SOURCE_GIT_COMMIT: ${AURSMITH_SOURCE_GIT_COMMIT:-development}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /config:size=16m,mode=0700
      - /data:size=16m,mode=0700
      - /tmp:size=16m,mode=1777
    ports:
      - ${AURSMITH_WEB_BIND:-127.0.0.1:8080}:8080
    networks: [control]
    depends_on:
      controller:
        condition: service_healthy
    restart: unless-stopped

secrets:
  setup_token:
    file: ${AURSMITH_SETUP_TOKEN_FILE:-./secrets/setup_token}
  controller_signing_key:
    file: ${AURSMITH_SIGNING_KEY_FILE:-./secrets/controller_signing_key}
  worker_ssh_key:
    file: ${AURSMITH_WORKER_SSH_KEY_FILE:-./secrets/worker_ssh_key}
  worker_known_hosts:
    file: ${AURSMITH_WORKER_KNOWN_HOSTS_FILE:-./secrets/worker_known_hosts}

volumes:
  controller-data:

networks:
  control:
    internal: true
